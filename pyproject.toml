[project]
name = "mlops-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Floor kept low: dvc[s3] -> s3fs -> aiobotocore pins a narrow botocore
    # window, and a high boto3 floor forces the resolver off modern DVC.
    "boto3>=1.34",
    "dvc[s3]>=3.60",
    "mlflow==3.15.1",
    "pandas==2.3.3",
    "pyarrow==25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
