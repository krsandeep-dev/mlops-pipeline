[project]
name = "mlops-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Floor kept low: dvc[s3] -> s3fs -> aiobotocore pins a narrow botocore
    # window, and a high boto3 floor forces the resolver off modern DVC.
    "boto3>=1.34",
    "dvc[s3]>=3.60",
    "lightgbm>=4.7.0",
    "mlflow==3.15.1",
    "pandas==2.3.3",
    "pyarrow==25.0.0",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_pipeline"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
# Mirrors PYTHONPATH=/opt/airflow/src in the Airflow containers, so the package
# imports the same way on the host without being installed.
pythonpath = ["src"]
