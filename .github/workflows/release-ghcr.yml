# Multi-arch build and push to GHCR, then the values bump that declares intent.
# CI never touches the cluster: this ends at a committed tag, which `make helm-sync`
# deploys locally today and Phase 7's ArgoCD will read with no change to this file.
name: Release to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'serving/**'
      - 'src/mlops_pipeline/**'
      - 'charts/model-serving/**'
      # The bump target itself. Without this exclusion the bump commit re-enters the
      # build and the pipeline chases its own tail.
      - '!charts/model-serving/values.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/release-ghcr.yml'

permissions:
  contents: write        # the bump commit
  packages: write        # GHCR push

# GitHub's implicit shell for `run` is `bash -e {0}` -- no pipefail -- so any step that
# pipes gets the exit code of the LAST command in the pipeline. An AccessDenied from aws
# piped into tee reads as a passing step, which is exactly how a missing IAM permission
# survived a green run here. Declaring `shell: bash` switches it to `bash -eo pipefail`,
# so every pipe in every step of this workflow fails on the first failing command.
defaults:
  run:
    shell: bash

# Two merges must not race the same values file. cancel-in-progress is deliberately
# false: a half-finished push that gets cancelled would leave the tag unbumped.
concurrency:
  group: release-ghcr-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mlops-serving

jobs:
  # Native builds, no QEMU: emulating a scipy/scikit-learn/mlflow build is slow enough to
  # distort the whole pipeline. Each runner pushes by digest; the manifest list is joined
  # afterwards, which is the only way to build a multi-arch image on heterogeneous hosts.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm     # free on public repos; k3d on Apple Silicon is arm64
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      digest-amd64: ${{ steps.collect.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.collect.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: serving/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Report size and digest for ${{ matrix.arch }}
        id: collect
        run: |
          echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  # Joins the two digests into one manifest list under the commit SHA, so a single tag
  # serves both architectures and k3d pulls the right one without asking.
  merge:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Create the multi-arch manifest list
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }} \
            ${{ env.IMAGE }}@${{ needs.build.outputs.digest-amd64 }} \
            ${{ env.IMAGE }}@${{ needs.build.outputs.digest-arm64 }}

      - name: Verify both platforms are present
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }} | tee /tmp/inspect.txt
          grep -q "linux/amd64" /tmp/inspect.txt || { echo "amd64 missing"; exit 1; }
          grep -q "linux/arm64" /tmp/inspect.txt || { echo "arm64 missing"; exit 1; }
          { echo '### manifest list'; echo '```'; cat /tmp/inspect.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The handoff. Declares what should be deployed; deploying it is a separate, local act.
  bump:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No [skip ci] marker. A tag push is a push event, so [skip ci] on the tagged
      # commit's message would silently skip release-ecr later. The retrigger guard is
      # the default GITHUB_TOKEN (pushes with it do not start workflow runs) plus the
      # values-file path exclusion above -- two real layers instead of a trap.
      - name: Bump image.tag and commit
        run: |
          TAG=${{ needs.merge.outputs.tag }}
          sed -i -E "s|^(  tag: ).*|\1\"${TAG}\"|" charts/model-serving/values.yaml
          grep -E '^  tag:' charts/model-serving/values.yaml

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet charts/model-serving/values.yaml; then
            echo "image.tag already ${TAG}; nothing to commit"
            exit 0
          fi
          git commit -am "Deploy ${TAG}"
          git push
          echo "bumped image.tag to ${TAG}" >> "$GITHUB_STEP_SUMMARY"
