apiVersion: v1
kind: Service
metadata:
  name: {{ include "model-serving.name" . }}
  labels:
    {{- include "model-serving.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "model-serving.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
