image:
  repository: ghcr.io/krsandeep-dev/mlops-serving
  # No default on purpose. The image reaches the node only through `k3d image import`,
  # and `make image` stamps the tag it built into .image-tag. A default here -- "latest",
  # an appVersion, or the tag copied from the raw manifest -- could install an image that
  # is present on the node, passes every probe and every smoke assertion, and is not the
  # image that was verified. `required` in the template turns that silent staleness into
  # a failed install. `make helm-install` supplies it from .image-tag.
  tag: "86b65a4"
  # The cluster has no registry until Phase 4, so a pull attempt is always wrong.
  pullPolicy: IfNotPresent

replicaCount: 1

# Rendered into the ConfigMap. No Secret: MLflow answers artifact requests with a
# presigned URL whose SigV4 signature is in the query string, so the pod never builds an
# S3 request and never needs credentials.
env:
  mlflowTrackingUri: "http://mlflow:5000"
  modelUri: "models:/taxi-trip-duration@champion"

ingress:
  enabled: true
  className: traefik
  host: mlops-serving.localhost

# Measured, not guessed: anon 186 MiB, peak 566 MiB from the cgroup after load and 30
# served predictions. The limit sits above observed peak because an OOMKill presents as
# CrashLoopBackOff.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# The startup ceiling (periodSeconds x failureThreshold = 240s) is deliberately longer
# than the app's own 180s model-load timeout, so a broken artifact path reports the app's
# specific error instead of being replaced by a CrashLoopBackOff.
probes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 48
  liveness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
