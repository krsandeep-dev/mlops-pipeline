# ingressClassName must be `traefik`: k3s bundles Traefik and installs that IngressClass.
# A wrong class produces an Ingress object that is created successfully and routes
# nothing, so M3 verifies an actual prediction through it rather than object creation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: model-serving
  namespace: serving
spec:
  ingressClassName: traefik
  rules:
    - host: mlops-serving.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: model-serving
                port:
                  name: http
