# `kubectl apply -f k8s/` applies files alphabetically, so configmap.yaml raced ahead of
# namespace.yaml and failed. Kustomize orders by kind -- Namespace first -- so
# `kubectl apply -k k8s/` is correct on a clean cluster and stays correct as files are
# added.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: serving
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
