apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: serving
  labels:
    app.kubernetes.io/name: model-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-serving
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serving
          image: mlops-serving:fb0df58
          # The image reaches the node only via `k3d image import`; there is no registry
          # until Phase 4, so a pull attempt would be a guaranteed ImagePullBackOff.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: model-serving
          # Measured cold start (first pod, image freshly imported): container start
          # 12:47:50 -> app ready 12:47:53.086 = 3.1s, of which ~1.1s is importing
          # lightgbm/pandas/mlflow and ~1.9s is resolving the alias and pulling the
          # 2.1 MB model. Kubernetes observed Ready at 5s, i.e. one probe period.
          #
          # The 240s ceiling (5s x 48) is deliberately longer than that, because it must
          # outlast the app's own 180s model-load timeout. If the probe gave up first,
          # a broken artifact path would present as CrashLoopBackOff and the app's
          # specific error would never be reported; instead the pod stays NotReady with
          # the reason in its logs. The 5s period keeps a healthy start fast to detect
          # and turns readiness red within one period when a load fails.
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Measured after load and 30 served predictions (cgroup, not `kubectl top` --
          # our own k3d config disables metrics-server, and this is the number the OOM
          # killer actually compares against memory.max):
          #   anon 186 MiB   <- unreclaimable working set
          #   file 272 MiB   <- page cache, reclaimed under pressure before any OOM
          #   memory.current 504 MiB, memory.peak 566 MiB, process VmRSS 271 MiB
          # The limit is set above observed peak rather than above anon: an OOMKill
          # surfaces as CrashLoopBackOff, which is expensive to diagnose, so the headroom
          # is worth more than the reclaimed megabytes.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # readOnlyRootFilesystem is deliberately off: MLflow downloads the model into
            # a local cache under $HOME at startup. Closing this needs emptyDir mounts for
            # $HOME and /tmp -- noted as a production gap rather than done blind.
            readOnlyRootFilesystem: false
